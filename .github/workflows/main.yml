name: CI/CD

on:
  push:
    branches: ["main", "master", "develop", "dev", "next"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "LICENSE"
  # Keep this list in sync with the push branches above: a base branch that can
  # receive pushes must also validate the PRs merging into it, or every PR into
  # it lands with zero CI and the suite only runs post-merge.
  pull_request:
    branches: ["main", "master", "develop", "dev", "next"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "LICENSE"
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip lint and tests (only build and push)"
        required: true
        type: boolean
        default: false

# Least-privilege default for every job; release/docker elevate per-job below.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  IMAGE: docker.io/voidput/scmcp

jobs:
  validate:
    name: Lint, Test & Build
    if: ${{ inputs.skip_tests != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci --prefer-offline --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      # tsc is the type gate as well as the build — the Docker image compiles
      # again from scratch, so a failure here must not reach the image job.
      - name: Build
        run: npm run build

      - name: Dependency Audit (advisory)
        # Non-blocking: a transitive advisory with no fix available should be
        # visible on every run without blocking every merge.
        continue-on-error: true
        run: npm audit --audit-level=high --omit=dev

  release:
    name: Semantic Release
    needs: [validate]
    if: |
      always() &&
      (needs.validate.result == 'success' || needs.validate.result == 'skipped') &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      contains(fromJson('["refs/heads/main", "refs/heads/master", "refs/heads/develop", "refs/heads/dev", "refs/heads/next"]'), github.ref)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
      new_release_git_tag: ${{ steps.semantic.outputs.new_release_git_tag }}
      new_release_channel: ${{ steps.semantic.outputs.new_release_channel }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # semantic-release needs the full history to work out the next version
          # from the commits since the last tag.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci --prefer-offline --no-audit --no-fund

      - name: Run semantic-release
        id: semantic
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        with:
          # Keep in sync with the semantic-release pin in package.json. Without
          # this the action runs whatever tree it bundles, which can differ from
          # the plugin versions this repo's devDependencies resolve.
          semantic_version: 25.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Build & Push Image
    needs: [validate, release]
    if: |
      always() && !cancelled() &&
      (needs.validate.result == 'success' || needs.validate.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      IS_RELEASE: ${{ needs.release.outputs.new_release_published == 'true' }}
      VERSION: ${{ needs.release.outputs.new_release_version }}
      # Empty on the default channel, "beta"/"next" on a prerelease branch.
      CHANNEL: ${{ needs.release.outputs.new_release_channel }}
      PUSH: ${{ github.event_name != 'pull_request' }}
    steps:
      # On a release, build the tag semantic-release just cut, not the commit
      # that triggered the run — the version bump and changelog land in that tag.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.IS_RELEASE == 'true' && format('v{0}', env.VERSION) || github.ref }}

      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
        if: env.PUSH == 'true'

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to Docker Hub
        if: env.PUSH == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The semver ladder is fed an explicit `value` rather than the git ref:
      # this job runs on the branch push, so the ref is `main`/`develop`, not
      # `vX.Y.Z`. What each build publishes:
      #   stable release      1.4.2, 1.4, 1, latest, main, sha-<commit>
      #   prerelease          1.5.0-beta.1, beta, sha-<commit>
      #   push, no release    sha-<commit>
      # A prerelease deliberately gets no floating major/minor/latest tag — those
      # must keep pointing at the newest *stable* build, or `:1` and `:latest`
      # would start serving beta code to everyone tracking them.
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          # `latest` is driven by the explicit raw tag below, never inferred.
          flavor: latest=false
          tags: |
            type=sha,prefix=sha-
            type=semver,pattern={{version}},value=${{ env.IS_RELEASE == 'true' && format('v{0}', env.VERSION) || 'v0.0.0' }},enable=${{ env.IS_RELEASE == 'true' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.IS_RELEASE == 'true' && format('v{0}', env.VERSION) || 'v0.0.0' }},enable=${{ env.IS_RELEASE == 'true' && !contains(env.VERSION, '-') }}
            type=semver,pattern={{major}},value=${{ env.IS_RELEASE == 'true' && format('v{0}', env.VERSION) || 'v0.0.0' }},enable=${{ env.IS_RELEASE == 'true' && !contains(env.VERSION, '-') }}
            type=raw,value=latest,enable=${{ env.IS_RELEASE == 'true' && !contains(env.VERSION, '-') }}
            # `main` predates the semver ladder and existing pullers still track
            # it, so it is kept alive as a straight alias of `latest` — same
            # condition, same image. It does NOT follow unreleased commits.
            type=raw,value=main,enable=${{ env.IS_RELEASE == 'true' && !contains(env.VERSION, '-') }}
            type=raw,value=${{ env.CHANNEL || github.ref_name }},enable=${{ env.IS_RELEASE == 'true' && contains(env.VERSION, '-') }}
          labels: |
            org.opencontainers.image.version=${{ env.IS_RELEASE == 'true' && env.VERSION || github.sha }}

      - name: Build & Push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          # arm64 goes through qemu, so PR builds stay single-arch: they only
          # need to prove the Dockerfile still builds.
          platforms: ${{ env.PUSH == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: ${{ env.PUSH == 'true' && 'mode=max' || 'false' }}
          sbom: ${{ env.PUSH == 'true' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
